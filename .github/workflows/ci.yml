name: CI

# 门禁只跑离线三套件:本插件无构建步骤、零运行时依赖,测试不需要 DSH 在跑。
# 线上套件(tests/live-*.mjs)需要真实宿主与 cookie,只能在开发者本机跑,不进 CI。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 取消被新提交取代的 PR 运行;push 运行不取消(它产出的就是合并后的信号)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 宿主要求的 Node 线:^22.19 || >=24
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # 两个「半边」先过语法:client.js 是浏览器脚本(靠模块表拿 react),
      # index.js 是宿主插件。node --check 只看语法,不执行。
      # tools/*.mjs 也是只做语法检查 —— 真页面验证器要浏览器与运行中的 dsh web,不进 CI。
      # scripts/*.mjs 是 CI 自己的工具(清单门禁),同样只过语法。
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          for file in tools/*.mjs scripts/*.mjs; do node --check "$file"; done

      # 文档门禁:断链 + 孤儿(docs/ 下每篇 md 至少被另一篇链接)。它只读文件系统、
      # 零依赖,所以放在安装/测试之前;以前它只在本地手动跑,断链/漏登记能静默到发版。
      - name: Docs links (breakage + orphans)
        run: npm run docs:check

      # 943 条离线断言:attribution 11 / logic 806 / host 100 / compat 17 / replay 9。
      # logic.mjs 会把 client.js 里的真函数抽进沙箱,所以它同时是客户端半的回归门;
      # compat.mjs 用**上一版 schemaVersion** 的夹具包喂当前读方(1.0 的冻结承诺靠它)。
      - name: Offline suites (943 assertions)
        run: |
          node tests/attribution.mjs
          node tests/logic.mjs
          node tests/host.mjs
          node tests/compat.mjs
          node tests/replay.mjs

      # 离线渲染冒烟(1.0 / S2):用最小桩把主界面 / 卡顿详情 / 开发者详情五页签 / 设置 /
      # 收起态 / 关闭态各渲染一遍,断言 0 抛错 + 关键文案在场 + 没有漏成 key 的文案。
      # 它挡的正是 check-panel 当年挡的那一类("套件全绿、浏览器里一展开就 ReferenceError");
      # 真页面验收器要浏览器 + 本机 dsh web,进不了 CI,这条是它的离线替身。
      - name: Offline render smoke
        run: node tools/render-smoke.mjs

      # 诊断 Skill §2.6 的前缀表是**生成**出来的(1.0 / S5):改了 capabilityMissing() 里的前缀
      # 却没重跑生成器,这里红。等价于「生成器跑一遍 → 工作区无 diff」。
      - name: Missing-prefix table has no drift
        run: node tools/gen-prefix-table.mjs --check

      # 面板文案的长度预算与单位一致性断言在 logic.mjs 里;这里再核一次
      # 「断言总数」与文档声称的一致(改数字忘了同步文档时,这条会红)。
      - name: Assertion count matches the docs
        run: |
          total=0
          for suite in attribution logic host compat replay; do
            count=$(node "tests/$suite.mjs" | grep -c '^ok')
            echo "$suite: $count"
            total=$((total + count))
          done
          echo "total: $total"
          test "$total" -eq 943
          # 文档里的数字也要跟着走:CONTRIBUTING 曾经停在 325 / 39 / 358,而这条门禁
          # 以前只核总数 —— 五份文档里任何一份漏改,读者看到的就不是实际条数。
          for doc in README.md README_EN.md REVIEW.md AGENTS.md CONTRIBUTING.md; do
            grep -q "943" "$doc" || { echo "$doc 里没有 943"; exit 1; }
          done

  # 发货门禁单开一个 job:它跟 Node 版本无关,没必要在 22 / 24 两条腿上各跑一遍,
  # 也不该让矩阵里的某一条腿红了就把它一起挡掉。
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 清单完整性:package.json#dsh 的形状,以及 bundle.patch / exports["./client"] /
      # icon 指向的文件到底在不在。三个插件仓库共用同一份脚本(sha256 一致)。
      # 这一条挡的是「npm publish 绿灯、用户装完面板 404 或 profile 起不来」。
      - name: Plugin manifest
        run: node scripts/check-plugin-manifest.mjs

      # 本仓库自己的发货清单(工具只读文件系统,零依赖):必带 12 份文件 + tools/locale/skills
      # 三个目录齐全,且目录里的每个文件都进了包;外加 dshReleases 兼容矩阵的核对。
      # 以前这条只在发版路径上跑,PR 里漏登记 files 要等 tag 打完才红。
      - name: Shipping list (files ↔ package.json)
        run: node tools/check-pack.mjs

      # 包内容:以 npm 自己的打包结果为准(不自写 files 通配匹配器),
      # 核两件事 —— 清单引用的文件都在包里;包里没有 node_modules/.e2e/截图/日志。
      - name: Package contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node scripts/check-plugin-manifest.mjs --pack "$RUNNER_TEMP/pack.json"
