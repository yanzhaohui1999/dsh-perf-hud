name: Release

# 在 GitHub Release 发布(tag vX.Y.Z)时把包发到 npm,使用 npm Trusted Publishing(OIDC),
# 不需要 NPM_TOKEN 秘密,并附带 provenance。
#
# 一次性配置(npmjs.com 手动做一次):
#   package dsh-perf-hud -> Settings -> Publishing access -> Trusted Publishers
#   Provider: GitHub Actions / 填 owner、repo、Workflow filename: release.yml / Environment 留空
#   参考:https://docs.npmjs.com/trusted-publishers
#
# 版本号含 "-"(如 0.3.0-rc.1)走 npm 的 `next` dist-tag,否则走 `latest`。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包不发版
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Trusted Publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 不能在 runner 自带的 npm 上赌 dist-tag:Trusted Publishing 的文档写明
      # "dist-tags with OIDC Trusted publishing requires npm CLI version 11.21.0 (or later)",
      # 而 node 24 自带的是 11.17.0(本机同版本 node v24.19.0 实测)。我们的 Publish 步骤
      # 带 `--tag latest|next`(预发布走 next),所以显式升一次,把版本这条不确定剔掉。
      - name: Use a recent npm CLI (OIDC dist-tags need >= 11.21.0)
        run: |
          npm install -g npm@latest
          npm -v

      # tag 必须与 package.json 的 version 一致,否则直接失败,避免发错版本。
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - name: Offline suites (539 assertions)
        run: |
          node tests/attribution.mjs
          node tests/logic.mjs
          node tests/host.mjs

      # 发布产物核对:两个半边、patch、图标、许可证、package.json,以及 README / AGENTS 链接到的
      # 全部文档都必须在包里 —— 漏一份,npm 页面上就是一个死链。
      # `tools/` 与 `locale/` 按**目录**核(它们就是 `package.json#files` 里的两个目录项):
      # 写死 `tools/inspect-incident.mjs` / `locale/en.json` 会在以后加验证器、加语言文件时漏检。
      - name: Pack and inspect
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for f in index.js client.js cordis.patch.yml icon.svg package.json \
                   README.md README_EN.md LICENSE CHANGELOG.md CONTRIBUTING.md AGENTS.md \
                   REVIEW.md; do
            grep -q "$f" /tmp/pack.txt || { echo "打包产物缺 $f"; exit 1; }
          done
          for dir in tools locale; do
            found=0
            for f in "$dir"/*; do
              [ -e "$f" ] || continue
              found=$((found + 1))
              grep -q "$f" /tmp/pack.txt || { echo "打包产物缺 $f"; exit 1; }
            done
            [ "$found" -gt 0 ] || { echo "目录 $dir 里没有文件可核 —— package.json#files 是不是漏了这个目录?"; exit 1; }
          done

      # 首发只能手工做(OIDC 发不了第一个版本:Trusted Publisher 要在包已经存在之后才能配,
      # 见 npm/cli#8544)。所以这个工作流必须对"该版本已经在 npm 上"幂等:否则给那个 tag
      # 建 Release 时,这一步会因为重复发布而当掉,红的是一次本该成功的发布。
      # 查询失败不许猜结果(网络抖动 != 没发过),照实报错退出。
      - name: Check whether this version is already on the registry
        id: registry
        if: github.event_name == 'release' || inputs.dry_run == false
        run: |
          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if out="$(npm view "$pkg@$version" version 2>&1)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$pkg@$version 已经在 npm 上 —— 跳过发布。"
            printf 'registry 回执:%s\n' "$out"
          elif printf '%s' "$out" | grep -q 'E404'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$pkg@$version 不在 npm 上 —— 继续发布。"
          else
            echo "查询 registry 失败,不猜结果:"
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Publish
        if: (github.event_name == 'release' || inputs.dry_run == false) && steps.registry.outputs.published == 'false'
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "publishing $version with dist-tag $tag"
          npm publish --provenance --access public --tag "$tag"
