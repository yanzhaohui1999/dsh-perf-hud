name: Release

# 在 GitHub Release 发布(tag vX.Y.Z)时把包发到 npm,使用 npm Trusted Publishing(OIDC),
# 不需要 NPM_TOKEN 秘密,并附带 provenance。
#
# 一次性配置(npmjs.com 手动做一次):
#   package dsh-perf-hud -> Settings -> Publishing access -> Trusted Publishers
#   Provider: GitHub Actions / 填 owner、repo、Workflow filename: release.yml / Environment 留空
#   参考:https://docs.npmjs.com/trusted-publishers
#
# 版本号含 "-"(如 0.3.0-rc.1)走 npm 的 `next` dist-tag,否则走 `latest`。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包不发版
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Trusted Publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # tag 必须与 package.json 的 version 一致,否则直接失败,避免发错版本。
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - name: Offline suites (302 assertions)
        run: |
          node tests/attribution.mjs
          node tests/logic.mjs
          node tests/host.mjs

      # 发布产物核对:两个半边、patch、图标、许可证,以及 README / AGENTS 链接到的
      # 全部文档都必须在包里 —— 漏一份,npm 页面上就是一个死链。
      - name: Pack and inspect
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for f in index.js client.js cordis.patch.yml icon.svg locale/en.json \
                   README.md README_EN.md LICENSE CHANGELOG.md CONTRIBUTING.md AGENTS.md \
                   REVIEW.md; do
            grep -q "$f" /tmp/pack.txt || { echo "打包产物缺 $f"; exit 1; }
          done

      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "publishing $version with dist-tag $tag"
          npm publish --provenance --access public --tag "$tag"
