name: Release

# 在 GitHub Release 发布(tag vX.Y.Z)时把包发到 npm,使用 npm Trusted Publishing(OIDC),
# 不需要 NPM_TOKEN 秘密,并附带 provenance。
#
# 一次性配置(npmjs.com 手动做一次):
#   package dsh-perf-hud -> Settings -> Publishing access -> Trusted Publishers
#   Provider: GitHub Actions / 填 owner、repo、Workflow filename: release.yml / Environment 留空
#   参考:https://docs.npmjs.com/trusted-publishers
#
# 版本号含 "-"(如 0.3.0-rc.1)走 npm 的 `next` dist-tag,否则走 `latest`。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包不发版
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Trusted Publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 不能在 runner 自带的 npm 上赌 dist-tag:Trusted Publishing 的文档写明
      # "dist-tags with OIDC Trusted publishing requires npm CLI version 11.21.0 (or later)",
      # 而 node 24 自带的是 11.17.0(本机同版本 node v24.19.0 实测)。我们的 Publish 步骤
      # 带 `--tag latest|next`(预发布走 next),所以显式升一次,把版本这条不确定剔掉。
      - name: Use a recent npm CLI (OIDC dist-tags need >= 11.21.0)
        run: |
          npm install -g npm@latest
          npm -v

      # tag 必须与 package.json 的 version 一致,否则直接失败,避免发错版本。
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      # 发版路径也要过语法门:与 ci.yml 同一条。node --check 只看语法、不执行 ——
      # client.js 是浏览器脚本(靠模块表拿 react),index.js 是宿主插件,tools/*.mjs 里有
      # 真页面验收器(它们要浏览器与运行中的 dsh web,所以这里只做语法检查,不跑)。
      # 少了这一步,一次"语法都过不了"的提交只要 tag 打得够快就能走到 npm publish。
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          for file in tools/*.mjs; do node --check "$file"; done

      - name: Offline suites (735 assertions)
        run: |
          node tests/attribution.mjs
          node tests/logic.mjs
          node tests/host.mjs
          node tests/compat.mjs

      # 与 ci.yml 同一条:断言总数与文档声称的一致。以前只有 ci.yml 核这个,
      # 而发版是**从 release 事件**进来的 —— 文档里的数字写错了,发版路径照样绿着走到 publish。
      # 五份文档逐个核(不只是总数):CONTRIBUTING 曾经停在 325 / 39 / 358。
      - name: Assertion count matches the docs
        run: |
          total=0
          for suite in attribution logic host compat; do
            count=$(node "tests/$suite.mjs" | grep -c '^ok')
            echo "$suite: $count"
            total=$((total + count))
          done
          echo "total: $total"
          test "$total" -eq 735
          for doc in README.md README_EN.md REVIEW.md AGENTS.md CONTRIBUTING.md; do
            grep -q "735" "$doc" || { echo "$doc 里没有 735"; exit 1; }
          done

      # 发布产物核对:两个半边、patch、图标、许可证、package.json,以及 README / AGENTS 链接到的
      # 全部文档都必须在包里 —— 漏一份,npm 页面上就是一个死链。
      # `tools/` / `locale/` / `skills/` 按**目录**核(它们就是 `package.json#files` 里的目录项):
      # 写死 `tools/inspect-incident.mjs` / `locale/en.json` 会在以后加验证器、加语言文件时漏检。
      # 目录要**递归**展开:0.9.0 新增的 `skills/<name>/SKILL.md` 有两层,只匹配一层会看到
      # `skills/dsh-perf-diagnosis` 这个目录名就放行 —— 那个名字在 tarball 里出现与否,
      # 证明不了 SKILL.md 本身在不在。
      - name: Pack and inspect
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for f in index.js client.js cordis.patch.yml icon.svg package.json \
                   README.md README_EN.md LICENSE CHANGELOG.md CONTRIBUTING.md AGENTS.md \
                   REVIEW.md; do
            grep -q "$f" /tmp/pack.txt || { echo "打包产物缺 $f"; exit 1; }
          done
          # 包内分片(client.<suffix>.js)必须随包发出:漏一个,面板启动时 `require.async` 直接 404。
          for f in client.*.js; do
            [ -e "$f" ] || continue
            grep -q "$f" /tmp/pack.txt || { echo "打包产物缺分片 $f"; exit 1; }
          done
          for dir in tools locale skills; do
            found=0
            while IFS= read -r f; do
              found=$((found + 1))
              grep -qF "$f" /tmp/pack.txt || { echo "打包产物缺 $f"; exit 1; }
            done < <(find "$dir" -type f | sort)
            [ "$found" -gt 0 ] || { echo "目录 $dir 里没有文件可核 —— package.json#files 是不是漏了这个目录?"; exit 1; }
          done

      # 首发只能手工做(OIDC 发不了第一个版本:Trusted Publisher 要在包已经存在之后才能配,
      # 见 npm/cli#8544)。所以这个工作流必须对"该版本已经在 npm 上"幂等:否则给那个 tag
      # 建 Release 时,这一步会因为重复发布而当掉,红的是一次本该成功的发布。
      # 查询失败不许猜结果(网络抖动 != 没发过),照实报错退出。
      - name: Check whether this version is already on the registry
        id: registry
        if: github.event_name == 'release' || inputs.dry_run == false
        run: |
          pkg="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if out="$(npm view "$pkg@$version" version 2>&1)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$pkg@$version 已经在 npm 上 —— 跳过发布。"
            printf 'registry 回执:%s\n' "$out"
          elif printf '%s' "$out" | grep -q 'E404'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$pkg@$version 不在 npm 上 —— 继续发布。"
          else
            echo "查询 registry 失败,不猜结果:"
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Publish
        if: (github.event_name == 'release' || inputs.dry_run == false) && steps.registry.outputs.published == 'false'
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "publishing $version with dist-tag $tag"
          npm publish --provenance --access public --tag "$tag"
